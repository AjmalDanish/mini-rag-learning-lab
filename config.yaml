# Mini RAG Learning Lab Configuration

# Embedding model settings
embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  fallback_model: "sentence-transformers/paraphrase-MiniLM-L6-v2"
  normalize: true

# Chunking settings
chunking:
  chunk_size_words: 20
  overlap_words: 4
  strategy: "naive"  # naive | sentence

# Vector database settings
vectordb:
  collection_name: "documents"
  persist_dir: "./chroma_db"
  distance_metric: "cosine"

# Retrieval settings
retrieval:
  top_k: 3
  use_reranker: true
  cross_encoder: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# LLM settings
llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-3.5-turbo"
  temperature: 0.3
  timeout: 30
  max_retries: 3

# Prompt settings
prompt:
  max_chunks: 3
  system_prompt: |
    You are an HR assistant. Answer using ONLY the supplied context.
    If the answer is not present in the context, say you don't know.
    Do not use outside knowledge.

# Paths
paths:
  data_dir: "./data"
  output_dir: "./output"
  logs_dir: "./logs"
